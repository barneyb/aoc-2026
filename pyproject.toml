[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages]
find = { }

[project]
name = "barneyb-aoc-2026"
description = "My Advent of Code 2026 solvers"
authors = [
    { name = "Barney Boisvert", email = "bboisvert@gmail.com" }
]
version = "2026.1"
requires-python = ">= 3.11"
dependencies = [
    "advent-of-code-data",
]

[project.entry-points."barneyb_aoc_all.support"]
kotlin26 = "util.aoc_all_2026:support"

[project.entry-points."barneyb_aoc_all.solve"]
kotlin26 = "util.aoc_all_2026:solve"
